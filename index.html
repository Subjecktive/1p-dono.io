<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donate</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: url('image1.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }

    .donate-section {
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      max-width: 320px;
      width: 100%;
    }

    .paypal-form {
      display: inline-grid;
      justify-items: center;
      align-content: start;
      gap: 0.5rem;
    }

    .pp-T4Z7JFYJJ479U {
      text-align: center;
      border: none;
      border-radius: 0.25rem;
      min-width: 11.625rem;
      padding: 0 2rem;
      height: 2.625rem;
      font-weight: bold;
      background-color: #FFD140;
      color: #000000;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.25rem;
      cursor: pointer;
    }

    .qr-code {
      margin-top: 20px;
      width: 100%;
      max-width: 200px;
    }

    .powered-by {
      font-size: 0.75rem;
    }

    .powered-by img {
      height: 0.875rem;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="donate-section">
    <form class="paypal-form" action="https://www.paypal.com/ncp/payment/T4Z7JFYJJ479U" method="post" target="_blank">
      <input class="pp-T4Z7JFYJJ479U" type="submit" value="Buy Now" />
      <img src="https://www.paypalobjects.com/images/Debit_Credit_APM.svg" alt="cards" />
      <section class="powered-by">
        Powered by
        <img src="https://www.paypalobjects.com/paypal-ui/logos/svg/paypal-wordmark-color.svg" alt="paypal" />
      </section>
    </form>

    <!-- QR Code -->
    <img src="QR.jpeg" alt="QR Code" class="qr-code" />
  </div>
</body>
</html>
