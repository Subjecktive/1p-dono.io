<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donate Options</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      min-height: 100vh;
      background: url('image1.jpg') no-repeat center center fixed;
      background-size: cover;
      padding: 20px 10px;
      font-family: sans-serif;
    }

    .donate-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 600px;
    }

    .donate-container {
      flex: 1 1 40%;
      max-width: 45%;
      min-width: 140px;
      text-align: center;
    }

    .donate-button {
      background-color: #0070ba;
      color: white;
      border: none;
      padding: 14px 10px;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 10px;
      width: 100%;
    }

    .custom-donate-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .custom-donate-form input[type="number"] {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      text-align: center;
    }

    @media (max-width: 480px) {
      .donate-container {
        flex: 1 1 100%;
        max-width: 100%;
      }

      .donate-button {
        font-size: 1rem;
        padding: 12px;
      }

      .custom-donate-form input[type="number"] {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="donate-row">
    <!-- Donate 1p -->
    <div class="donate-container">
      <form action="https://www.paypal.com/donate" method="post" target="_blank">
        <input type="hidden" name="business" value="subjecktive@gmail.com" />
        <input type="hidden" name="currency_code" value="GBP" />
        <input type="hidden" name="amount" value="0.01" />
        <button type="submit" class="donate-button">Donate 1p</button>
      </form>
    </div>

    <!-- Donate £1 -->
    <div class="donate-container">
      <form action="https://www.paypal.com/donate" method="post" target="_blank">
        <input type="hidden" name="business" value="subjecktive@gmail.com" />
        <input type="hidden" name="currency_code" value="GBP" />
        <input type="hidden" name="amount" value="1.00" />
        <button type="submit" class="donate-button">Donate £1</button>
      </form>
    </div>

    <!-- Donate £5 -->
    <div class="donate-container">
      <form action="https://www.paypal.com/donate" method="post" target="_blank">
        <input type="hidden" name="business" value="subjecktive@gmail.com" />
        <input type="hidden" name="currency_code" value="GBP" />
        <input type="hidden" name="amount" value="5.00" />
        <button type="submit" class="donate-button">Donate £5</button>
      </form>
    </div>

    <!-- Donate £10 -->
    <div class="donate-container">
      <form action="https://www.paypal.com/donate" method="post" target="_blank">
        <input type="hidden" name="business" value="subjecktive@gmail.com" />
        <input type="hidden" name="currency_code" value="GBP" />
        <input type="hidden" name="amount" value="10.00" />
        <button type="submit" class="donate-button">Donate £10</button>
      </form>
    </div>

    <!-- Custom Amount -->
    <div class="donate-container">
      <form class="custom-donate-form" action="https://www.paypal.com/donate" method="post" target="_blank" onsubmit="return validateAmount()">
        <input type="hidden" name="business" value="subjecktive@gmail.com" />
        <input type="hidden" name="currency_code" value="GBP" />
        <input type="number" name="amount" id="custom-amount" placeholder="Enter £" step="0.01" min="0.01" required />
        <button type="submit" class="donate-button">Donate Custom</button>
      </form>
    </div>
  </div>

  <script>
    function validateAmount() {
      const amountInput = document.getElementById("custom-amount");
      const value = parseFloat(amountInput.value);
      if (isNaN(value) || value < 0.01) {
        alert("Please enter a valid amount (minimum £0.01).");
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
